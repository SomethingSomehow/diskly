[package]
name = "diskly"
version = "0.1.0"
edition = "2024"
description = "A fast TUI disk usage analyzer"

[dependencies]
ansi_colours = "1.2.3"
color-eyre = "0.6.5"
crossterm = "0.29.0"
directories = "6.0.0"
dunce = "1.0.5"
getset = "0.1.7"
humansize = "2.1.3"
indextree = "4.8.1"
jwalk = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3.55", features = ["std", "macros"] }
toml = "1.1.4+spec-1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
tui-piechart = "1.0.2"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
